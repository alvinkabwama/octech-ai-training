[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "octech-ai-training"
version = "0.1.0"
description = "Octech AI training programme: exercises and the mini-EDRMS practice app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Floors are CVE-fix versions that still support Python 3.10; newer Pythons resolve newer.
    "fastapi>=0.116",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "pytesseract>=0.3.13",
    "pillow>=11.3",
    # LLM access (OpenRouter is OpenAI-compatible). Capped below the next major: the
    # exercises teach this SDK's API.
    "openai>=3.0,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["mini_edrms*", "exercises*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ruff also formats Python blocks inside Markdown. Reference docs are kept verbatim.
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["mini_edrms/tests", "exercises"]
filterwarnings = [
    # Starlette >=1.x nudges TestClient users to `httpx2`; we stay on `httpx`; revisit when upgrading Starlette.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
